name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --all-targets --locked

  circuits:
    name: Circuits and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Installs the ADR-002 pinned versions. Running the same target a
      # contributor runs means CI also proves the documented setup works on a
      # clean machine.
      - name: Install the pinned proving toolchain
        run: |
          make setup-zk
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bb" >> "$GITHUB_PATH"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Report versions
        run: make versions

      - name: Circuit tests
        run: make circuits

      - name: Generate proofs and Solidity verifiers
        run: make prove

      # Fails if `bb write_solidity_verifier` produced something different from
      # what is committed — which would mean the vendored verifiers no longer
      # match the circuits they are supposed to verify.
      - name: Verifiers are in sync with the circuits
        run: git diff --exit-code -- contracts/src/verifiers/

      - name: Contract tests
        run: make contracts

      - name: End-to-end against Anvil
        run: make e2e-circuits

  compose:
    name: Dependencies start healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose up --wait
        run: docker compose up -d --wait
      - name: Show status
        if: always()
        run: docker compose ps
      - name: Tear down
        if: always()
        run: docker compose down -v
