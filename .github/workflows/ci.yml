name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Format and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo build
        run: cargo build --workspace --all-targets --locked
      - name: cargo test
        run: cargo test --workspace --all-targets --locked

  database:
    name: Migrations and store integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dray
          POSTGRES_PASSWORD: dray
          POSTGRES_DB: dray
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dray -d dray"
          --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15
    env:
      PGPASSWORD: dray
      PSQL: psql -h localhost -U dray -d dray -v ON_ERROR_STOP=1
    steps:
      - uses: actions/checkout@v5

      - name: Apply migrations
        run: |
          for f in migrations/*.sql; do
            echo "applying $f"
            $PSQL -f "$f"
          done

      # Prints the resulting schema into the build log, so a reviewer can see
      # what the migrations actually produced rather than inferring it.
      - name: Show the resulting schema
        run: |
          $PSQL -c "\d+ jobs"
          $PSQL -c "\d+ job_attempts"
          $PSQL -c "\d+ settlements"
          $PSQL -c "SELECT unnest(enum_range(NULL::job_state));"

      # The Postgres enum and the Rust enum must agree, or a state the code can
      # produce would be rejected by the database at runtime.
      - name: Postgres job_state matches dray_core::JobState
        run: |
          $PSQL -tAc "SELECT unnest(enum_range(NULL::job_state));" | sort > /tmp/pg_states.txt
          grep -oP 'JobState::\w+ => "\K[a-z_]+(?=")' crates/dray-core/src/job.rs \
            | sort > /tmp/rust_states.txt
          diff /tmp/pg_states.txt /tmp/rust_states.txt \
            || { echo "job_state enum drift between Postgres and Rust"; exit 1; }

      - name: Postgres job_event matches dray_core::JobEvent
        run: |
          $PSQL -tAc "SELECT unnest(enum_range(NULL::job_event));" | sort > /tmp/pg_events.txt
          grep -oP 'JobEvent::\w+ => "\K[a-z_]+(?=")' crates/dray-core/src/job.rs \
            | sort > /tmp/rust_events.txt
          diff /tmp/pg_events.txt /tmp/rust_events.txt \
            || { echo "job_event enum drift between Postgres and Rust"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A second, empty database. The steps above proved the raw SQL applies
      # under psql; the integration tests apply the same migrations through
      # sqlx's migrator instead, which is the path the services actually use on
      # start. Both are worth exercising, and they cannot share a database
      # because the second would find the schema already there.
      - name: Create a database for the integration tests
        run: $PSQL -c "CREATE DATABASE dray_test;"

      # The seed script is what a reviewer runs after `make up`. If it drifts
      # out of step with the schema, the quickstart breaks for everyone — so it
      # is executed here rather than merely committed.
      - name: Seed script applies
        run: psql -h localhost -U dray -d dray -v ON_ERROR_STOP=1 -f scripts/seed-circuits.sql

      # These are the tests that cannot run without a real database:
      # concurrent deduplication, transition serialisation, and the schema's
      # own check constraints. A required job, not an optional one.
      # Includes the Redis lease mirror. Its most important test is that an
      # unreachable Redis reports "unknown" rather than "free" — collapsing the
      # two would hand every in-flight job to a second worker during an outage.
      - name: Store integration tests
        env:
          DATABASE_URL: postgres://dray:dray@localhost:5432/dray_test
          REDIS_URL: redis://localhost:6379
        run: cargo test -p dray-store --features integration-tests

      # Drives the real router through real handlers against a real database.
      # A mocked store would not have caught the enum-decoding bug that the
      # store's own integration tests did.
      - name: API integration tests
        env:
          DATABASE_URL: postgres://dray:dray@localhost:5432/dray_test
        run: cargo test -p dray-api --features integration-tests

  circuits:
    name: Circuits, contracts, and settlement
    runs-on: ubuntu-latest
    # The relayer tests settle *real* proofs, so they belong in the job that
    # produces them rather than in one that would have to prove them again.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dray
          POSTGRES_PASSWORD: dray
          POSTGRES_DB: dray
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dray -d dray"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # Installs the ADR-002 pinned versions. Running the same target a
      # contributor runs means CI also proves the documented setup works on a
      # clean machine.
      - name: Install the pinned proving toolchain
        run: |
          make setup-zk
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bb" >> "$GITHUB_PATH"
          echo "$HOME/.foundry/bin" >> "$GITHUB_PATH"

      - name: Report versions
        run: make versions

      - name: Circuit tests
        run: make circuits

      - name: Generate proofs and Solidity verifiers
        run: make prove

      # Fails if `bb write_solidity_verifier` produced something different from
      # what is committed — which would mean the vendored verifiers no longer
      # match the circuits they are supposed to verify.
      - name: Verifiers are in sync with the circuits
        run: git diff --exit-code -- contracts/src/verifiers/

      - name: Contract tests
        run: make contracts

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # The worker's proving pipeline against the real toolchain. This is the
      # only job with `nargo` and `bb` installed, so it is the only place these
      # can run — and they are what proves the worker's generated Prover.toml
      # agrees with the circuits, the verification keys, and Barretenberg.
      # They assert the worker reproduces the exact nullifiers the e2e step
      # below settles on chain, so the two cannot drift apart silently.
      - name: Worker proving tests
        run: cargo test -p dray-worker --features proving-tests

      # Settlement against a real chain: the happy path, a forced reorg, a
      # nonce gap, an unreachable RPC, replay, and the permissioned relayer set.
      # Each test gets its own Anvil, because consuming a nullifier is global
      # and two tests sharing a chain would settle each other's proofs.
      - name: Relayer integration tests
        env:
          DATABASE_URL: postgres://dray:dray@localhost:5432/dray
        run: cargo test -p dray-relayer --features integration-tests --test anvil -- --test-threads 2

      - name: End-to-end against Anvil
        run: make e2e-circuits

  worker:
    name: Worker pool under load and chaos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dray
          POSTGRES_PASSWORD: dray
          POSTGRES_DB: dray
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dray -d dray"
          --health-interval 2s --health-timeout 3s --health-retries 15
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v5

      # The only job that needs both a database and the proving toolchain.
      # Leasing, retries, and shutdown are invisible without a store; proving is
      # invisible without nargo and bb. The phase's exit criteria need both at
      # once, so they cannot live in either of the existing jobs.
      - name: Install the pinned proving toolchain
        run: |
          make setup-zk
          echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bb" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Includes the 100-job load test and the chaos run that kills workers
      # mid-proof. Both assert against the transition log rather than against
      # what the workers reported, so a worker that lied about its own outcome
      # would still be caught.
      - name: Worker integration tests
        env:
          DATABASE_URL: postgres://dray:dray@localhost:5432/dray
          REDIS_URL: redis://localhost:6379
        run: cargo test -p dray-worker --features integration-tests --test lease_loop

  compose:
    name: Dependencies start healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose up --wait
        run: docker compose up -d --wait
      - name: Show status
        if: always()
        run: docker compose ps
      - name: Tear down
        if: always()
        run: docker compose down -v
