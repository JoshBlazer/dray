[package]
name = "dray-worker"
description = "Proving worker: leases jobs, runs nargo/bb under strict resource bounds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dray-core.workspace = true
dray-store.workspace = true
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = "1.24.0"

[features]
# Tests that shell out to a real `nargo` and `bb`. Off by default so a fresh
# clone can `cargo test` without the ZK toolchain installed; see
# `tests/proving.rs` for why they fail loudly rather than skip.
proving-tests = []

# Tests that drive a whole worker: real Postgres *and* real nargo/bb. These are
# the ones that can say anything about leasing, retries, shutdown, and chaos,
# because none of that is observable without a store behind it.
integration-tests = []

[lints]
workspace = true

[dev-dependencies]
chrono = "0.4.45"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
tempfile = "3.27.0"
uuid = { version = "1.24.0", features = ["v4"] }
