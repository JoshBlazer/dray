[package]
name = "dray-worker"
description = "Proving worker: leases jobs, runs nargo/bb under strict resource bounds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dray-core.workspace = true
dray-store.workspace = true
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "signal", "time", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = "1.24.0"

[features]
# Tests that shell out to a real `nargo` and `bb`. Off by default so a fresh
# clone can `cargo test` without the ZK toolchain installed; see
# `tests/proving.rs` for why they fail loudly rather than skip.
proving-tests = []

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
