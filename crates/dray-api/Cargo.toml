[package]
name = "dray-api"
description = "Ingest HTTP API: validate, canonicalise, dedupe, enqueue."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "dray_api"
path = "src/lib.rs"

[[bin]]
name = "dray-api"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
dray-core.workspace = true
dray-store.workspace = true
jsonschema = { version = "0.49.9", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["trace", "limit", "request-id", "util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = "1.24.0"

[lints]
workspace = true

[features]
# HTTP tests that need a live PostgreSQL behind the handlers. Off by default,
# enabled in CI — same reasoning as dray-store: a runtime skip would let a
# broken handler look green.
integration-tests = []

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1"
