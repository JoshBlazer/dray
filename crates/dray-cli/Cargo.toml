[package]
name = "dray-cli"
description = "Operator CLI: inspect jobs, replay failures, drain workers, queue stats."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "dray"
path = "src/main.rs"

[dependencies]
dray-core.workspace = true
dray-store.workspace = true
chrono = { version = "0.4.45", features = ["serde"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
uuid = { version = "1.24.0", features = ["serde"] }

[lints]
workspace = true
