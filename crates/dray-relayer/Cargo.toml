[package]
name = "dray-relayer"
description = "Chain submission: nonce management, gas policy, confirmation tracking."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alloy = { version = "2.4.1", default-features = false, features = [
    "std",
    "contract",
    "network",
    "providers",
    # The transport itself. `providers` alone builds a provider that cannot
    # connect to anything — it fails at runtime with "no transports enabled",
    # which is a start-up failure rather than a compile error.
    "reqwest",
    "rpc-types-eth",
    "signer-local",
    "sol-types",
] }
dray-core.workspace = true
dray-worker = { path = "../dray-worker" }
dray-store.workspace = true
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = "1.24.0"

[features]
# Tests that drive a real chain (Anvil) and a real Postgres.
integration-tests = []

[lints]
workspace = true

[dev-dependencies]
# So integration tests can turn on the relayer's own logs when diagnosing.
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
tempfile = "3.27.0"
