# Reference witness for the range proof circuit.
#
# Proves that a private value of 42 lies within the public range [18, 150],
# using secret = 12345.
#
# The nullifier is not listed because it is not an input — the circuit returns
# it, and it appears as the last public input of the resulting proof (ADR-008).
# Its expected value is printed by:
#
#   nargo test --show-output print_reference_witness

min = "18"
max = "150"

value = "42"
secret = "12345"
