[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"

# The generated Honk verifiers require 0.8.27 or later.
solc_version = "0.8.28"

# The verifiers are enormous and unrolled. Without the optimiser they exceed the
# EIP-170 24 KB deployed-bytecode limit; with it they fit.
optimizer = true
optimizer_runs = 200
via_ir = false

# Tests read proof fixtures produced by `bb prove` from the circuits directory.
# Read-only, and scoped to exactly that path.
fs_permissions = [{ access = "read", path = "../circuits/target" }]

[fuzz]
runs = 256

[profile.ci]
verbosity = 3

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
# The verifiers are vendored exactly as `bb write_solidity_verifier` emits them.
# CI asserts that regenerating them produces no diff, so reformatting would
# break that check on every run.
ignore = ["src/verifiers/membership.sol", "src/verifiers/range_proof.sol"]
